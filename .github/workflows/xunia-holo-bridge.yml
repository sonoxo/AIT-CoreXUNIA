name: XUNIA HOLO Bridge

on:
  pull_request:
    paths:
      - "ait/xunia_bridge/**"
      - "tests/ait/test_xunia_bridge.py"
      - "XUNIA-HOLO-BRIDGE.md"
      - ".github/workflows/xunia-holo-bridge.yml"
  push:
    branches: [master]
    paths:
      - "ait/xunia_bridge/**"
      - "tests/ait/test_xunia_bridge.py"
      - "XUNIA-HOLO-BRIDGE.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Run bridge contract tests
        run: pytest -q tests/ait/test_xunia_bridge.py
      - name: Truth-boundary checks
        run: |
          grep -q 'does \*\*not\*\* authorize, schedule, or transmit spacecraft commands' XUNIA-HOLO-BRIDGE.md
          grep -q 'xunia.ait.bridge/1.0' ait/xunia_bridge/envelope.py
          grep -q 'Only PUBLIC/NON_PROPRIETARY bridge markings are supported' ait/xunia_bridge/envelope.py
